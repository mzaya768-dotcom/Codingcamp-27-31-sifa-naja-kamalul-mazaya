<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER: Greeting + Date/Time + Theme Toggle -->
  <header class="header">
    <div class="header-left">
      <div class="greeting-name-row">
        <h1 id="greeting">Good Morning!</h1>
        <button id="edit-name-btn" class="icon-btn" title="Set your name">✏️</button>
      </div>
      <p id="user-name-display" class="user-name"></p>
      <p id="datetime" class="datetime"></p>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="theme-btn" title="Toggle Light/Dark Mode">🌙</button>
    </div>
  </header>

  <!-- Name Modal -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-box">
      <h2>What's your name?</h2>
      <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30" />
      <div class="modal-actions">
        <button id="save-name-btn" class="btn btn-primary">Save</button>
        <button id="cancel-name-btn" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <main class="dashboard">

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-duration-row">
        <label for="timer-minutes">Set minutes:</label>
        <input type="number" id="timer-minutes" min="1" max="99" value="25" />
        <button id="apply-timer-btn" class="btn btn-ghost btn-sm">Apply</button>
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-stop" class="btn btn-secondary">⏸ Stop</button>
        <button id="timer-reset" class="btn btn-ghost">↺ Reset</button>
      </div>
      <p id="timer-status" class="timer-status"></p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <div class="todo-controls">
        <div class="todo-input-row">
          <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="100" />
          <button id="todo-add-btn" class="btn btn-primary">Add</button>
        </div>
        <div class="todo-filter-row">
          <select id="todo-sort" class="select-input">
            <option value="default">Sort: Default</option>
            <option value="az">Sort: A → Z</option>
            <option value="za">Sort: Z → A</option>
            <option value="done">Sort: Done Last</option>
          </select>
          <select id="todo-filter" class="select-input">
            <option value="all">Filter: All</option>
            <option value="active">Filter: Active</option>
            <option value="done">Filter: Done</option>
          </select>
        </div>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <div class="todo-footer">
        <span id="todo-count" class="todo-count">0 tasks</span>
        <button id="clear-done-btn" class="btn btn-ghost btn-sm">Clear Done</button>
      </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="link-input-row">
        <input type="text" id="link-name-input" placeholder="Label (e.g. GitHub)" maxlength="30" />
        <input type="url" id="link-url-input" placeholder="URL (e.g. https://...)" />
        <button id="link-add-btn" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
